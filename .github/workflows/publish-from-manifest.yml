name: Publish from manifest

# Manual rescue: publishes the release recorded in .release-please-manifest.json when the
# automatic publish did not, for example after a dropped push event or a failed push.
# It runs the same shared workflow as the release itself, against the release tag, so it
# rebuilds exactly the released code even after main has moved on, and it confirms that
# every package reached nuget.org. --skip-duplicate makes re-runs safe.
#
# Usage:
#   gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.ValueObjects
#   gh workflow run publish-from-manifest.yml --repo ZeroAlloc-Net/ZeroAlloc.ValueObjects -f dry-run=true

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, pack and verify only; push nothing.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.manifest.outputs.tag }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the manifest version and find its tag
        id: manifest
        run: |
          set -euo pipefail
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if [ -z "$version" ]; then
            echo "::error::.release-please-manifest.json has no \".\" entry"
            exit 1
          fi
          tag="v$version"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::the manifest says $version but tag $tag does not exist; nothing was released to rescue"
            exit 1
          fi
          echo "Rescuing $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Same inputs as the publish job in release-please.yml, so a rescue reaches the same places.
  publish:
    needs: resolve
    uses: ZeroAlloc-Net/.github/.github/workflows/publish.yml@main
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      solution: ZeroAlloc.ValueObjects.slnx
      # Runtimes the tests target, besides the SDK that global.json pins.
      dotnet-version: |
        9.0.x
        10.0.x
      github-packages: true
      release-assets: true
      dry-run: ${{ inputs.dry-run }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
